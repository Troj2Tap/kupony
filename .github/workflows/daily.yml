name: Dzienne kupony
on:
  schedule:
    - cron: '0 21 * * *'   # 23:00 latem (CEST)
    - cron: '0 22 * * *'   # 23:00 zimą (CET); skrypt sam pomija zbędne uruchomienie
  workflow_dispatch:
    inputs:
      date:
        description: 'Pierwszy dzień RRRR-MM-DD (puste = automatycznie)'
        required: false
      days:
        description: 'Ile kolejnych dni wygenerować (1-7)'
        required: false
        default: '1'
      force:
        description: 'Nadpisz istniejące dni (true/false)'
        required: false
        default: 'false'
permissions:
  contents: write
  pages: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generuj kupony
        run: node scripts/generate.cjs ${{ github.event.inputs.date }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DAYS: ${{ github.event.inputs.days }}
          FORCE: ${{ github.event.inputs.force }}
      - name: Zapisz dane w repozytorium
        run: |
          git config user.name "kupony-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Kupony $(date -u +%F)" && git push)
      - name: Odswiez GitHub Pages
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ github.token }}
